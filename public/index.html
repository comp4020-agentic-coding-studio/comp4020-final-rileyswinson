<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stalls</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/room.css" />
  </head>
  <body class="loading unknown">
    <main id="hallway" aria-label="A corridor of four toilet stalls">
      <h1 class="sr-only">Stalls</h1>
      <div class="scene">
        <div class="wall">
          <div class="tube" aria-hidden="true"></div>
          <div class="floor" aria-hidden="true"></div>
          <div class="doors">
            <!-- app.js fills in one door per stall -->
          </div>
        </div>
      </div>
      <div class="vignette" aria-hidden="true"></div>
      <p class="status" role="status" aria-live="polite"></p>
      <div class="corridor-buttons">
        <button class="station-open" type="button">sticker station</button>
        <button class="stick-open" type="button">add a sticker to a door</button>
      </div>
    </main>

    <section id="room" hidden aria-label="Inside the stall">
      <div class="viewport">
        <div class="camera">
          <div class="world">
            <!-- room.js builds the stall in here -->
          </div>
        </div>
      </div>
      <div class="grain" aria-hidden="true"></div>
      <div class="room-vignette" aria-hidden="true"></div>
      <nav class="turn" aria-label="Look around">
        <button class="arrow left" type="button" data-turn="left" aria-label="Turn left">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="1.4" /></svg>
        </button>
        <button class="arrow right" type="button" data-turn="right" aria-label="Turn right">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="1.4" /></svg>
        </button>
        <button class="arrow up" type="button" data-turn="up" aria-label="Look up">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="1.4" /></svg>
        </button>
        <button class="arrow down" type="button" data-turn="down" aria-label="Look down">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="1.4" /></svg>
        </button>
      </nav>
      <div class="hud">
        <p class="room-timer" aria-live="off"></p>
        <div class="actions"></div>
      </div>
      <div class="palette" hidden>
        <div class="tools" role="radiogroup" aria-label="What to draw with">
          <button class="tool" type="button" data-k="pen" role="radio">paint pen</button>
          <button class="tool" type="button" data-k="marker" role="radio">marker</button>
          <button class="tool" type="button" data-k="spray" role="radio">mini spray</button>
        </div>
        <div class="inks" role="radiogroup" aria-label="Colour"></div>
        <div class="nibs" role="radiogroup" aria-label="Width">
          <button class="nib fine" type="button" aria-label="The narrower one" role="radio"></button>
          <button class="nib fat" type="button" aria-label="The wider one" role="radio"></button>
        </div>
        <button class="add-sticker" type="button">add a sticker</button>
        <button class="done" type="button">done</button>
      </div>
      <div class="picker" hidden role="dialog" aria-label="The pile of stickers under the toilet">
        <div class="picker-inner">
          <h2>the pile</h2>
          <p class="picker-note"></p>
          <div class="picker-pile tiles"></div>
          <h2>yours</h2>
          <p class="picker-mine-note"></p>
          <div class="picker-mine tiles"></div>
          <button class="picker-close" type="button">close</button>
        </div>
      </div>
      <span class="verb" hidden aria-hidden="true"></span>
      <div class="fade" aria-hidden="true"></div>
    </section>

    <!-- the sticker you've chosen, under the pointer until it's put somewhere -->
    <img id="ghost" alt="" hidden />

    <!-- which sticker: yours, or one you've picked up -->
    <div id="chooser" hidden role="dialog" aria-label="Choose a sticker">
      <div class="chooser-inner">
        <h2>yours</h2>
        <p class="chooser-mine-note"></p>
        <div class="chooser-mine tiles"></div>
        <h2>picked up</h2>
        <p class="chooser-pocket-note"></p>
        <div class="chooser-pocket tiles"></div>
        <button class="chooser-close" type="button">close</button>
      </div>
    </div>

    <!-- the sticker station: where stickers are made, out in the corridor only -->
    <section id="station" hidden role="dialog" aria-label="Sticker station" data-stage="outline">
      <div class="station-inner">
        <h2>sticker station</h2>
        <ol class="station-steps">
          <li data-step="outline">Create your outline</li>
          <li data-step="decorate">Select the outline color</li>
          <li data-step="decorate">Select the interior color</li>
          <li data-step="decorate">Draw your sticker</li>
          <li data-step="done">Use them, or leave them for others!</li>
        </ol>
        <canvas aria-label="The sticker you're making"></canvas>
        <p class="station-status" role="status"></p>
        <div class="station-row">
          <span class="station-label">outline</span>
          <div class="station-edge inks" role="radiogroup" aria-label="The outline's colour"></div>
        </div>
        <div class="station-row">
          <span class="station-label">interior</span>
          <div class="station-base inks" role="radiogroup" aria-label="The interior's colour"></div>
        </div>
        <div class="station-row">
          <span class="station-label">pen</span>
          <div class="station-ink inks" role="radiogroup" aria-label="The pen's colour"></div>
        </div>
        <div class="station-row">
          <span class="station-label">pen size</span>
          <div class="station-sizes" role="radiogroup" aria-label="The pen's size">
            <button class="station-size" type="button" data-w="2.5" role="radio"><i style="--dot: 0.3rem"></i>thin</button>
            <button class="station-size" type="button" data-w="5" role="radio"><i style="--dot: 0.6rem"></i>medium</button>
            <button class="station-size" type="button" data-w="10" role="radio"><i style="--dot: 1.05rem"></i>thick</button>
          </div>
        </div>
        <div class="station-buttons">
          <button class="station-again" type="button">start again</button>
          <button class="station-finish" type="button" disabled>finish</button>
          <button class="station-close" type="button">close</button>
        </div>
      </div>
    </section>

    <template id="door-template">
      <div class="stall">
        <span class="number" aria-hidden="true"></span>
        <button class="door" type="button">
          <span class="doorway" aria-hidden="true">
            <span class="light"></span>
            <span class="panel">
              <span class="lock"><span class="lock-label"></span><span class="knob"></span></span>
            </span>
          </span>
          <span class="spill" aria-hidden="true"></span>
        </button>
        <span class="countdown" aria-hidden="true"></span>
      </div>
    </template>

    <script type="module" src="/app.js"></script>
  </body>
</html>
